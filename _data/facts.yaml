# JP이야기(월드원공인중개사사무소) 운영 정책 값
#
# 사용법
# 1. value: null 을 실제 값으로 바꿉니다. 값에 쉼표·콜론이 있으면 큰따옴표로 감쌉니다.
#    예) value: "800,000원(VAT 별도)"
# 2. 작업 폴더에서 `python scripts/render_docs.py` 를 실행합니다.
# 3. company-profile.md, service-policy.md, faq.md 에 같은 값이 한 번에 반영됩니다.
#
# value 가 null 인 항목은 문서에 [확정 필요: label] 로 표시되고,
# 각 문서 끝 "운영 전 확정할 항목" 목록에 자동으로 들어갑니다.
# used_in 은 사람이 보기 위한 표시이며, 실제 사용처는 validate_docs.py 가 검사합니다.

